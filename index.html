<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Learns Addition</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0f1117;
    color: #e2e6ef;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .subtitle { color: #8b93a7; font-size: 0.9rem; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    width: 100%;
    max-width: 960px;
  }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: #171a23;
    border: 1px solid #262b38;
    border-radius: 12px;
    padding: 20px;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8b93a7;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 0.85rem; color: #aeb6c8; margin: 10px 0 4px; }
  input[type="number"], select {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #2e3546;
    background: #0f1117;
    color: #e2e6ef;
    font-size: 0.95rem;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: #3b82f6;
    color: white;
    transition: background 0.15s;
  }
  button:hover { background: #2563eb; }
  button.secondary { background: #262b38; color: #e2e6ef; }
  button.secondary:hover { background: #333a4d; }
  button.danger { background: #7f1d1d; }
  button.danger:hover { background: #991b1b; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat {
    background: #0f1117;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .stat .value { font-size: 1.15rem; font-weight: 700; color: #60a5fa; }
  .stat .label { font-size: 0.72rem; color: #8b93a7; text-transform: uppercase; letter-spacing: 0.05em; }
  canvas { width: 100%; height: 260px; display: block; background: #0f1117; border-radius: 8px; }
  .predict-row { display: flex; gap: 10px; align-items: center; }
  .predict-row span { color: #8b93a7; font-weight: 700; }
  .result {
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
    background: #0f1117;
    text-align: center;
    font-size: 1rem;
    line-height: 1.7;
  }
  .result b { color: #34d399; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 700;
    background: #14532d;
    color: #4ade80;
  }
  .badge.idle { background: #374151; color: #9ca3af; }
</style>
</head>
<body>
<h1>Neural Network &times; Addition</h1>
<p class="subtitle">A tiny feedforward network trained from scratch in your browser to learn <code>a + b</code></p>

<div class="grid">
  <div>
    <div class="card">
      <h2>Training <span id="statusBadge" class="badge idle">idle</span></h2>
      <label for="lr">Learning rate</label>
      <select id="lr">
        <option value="0.001">0.001</option>
        <option value="0.005" selected>0.005</option>
        <option value="0.01">0.01</option>
        <option value="0.05">0.05</option>
      </select>
      <label for="hidden">Hidden neurons per layer</label>
      <select id="hidden">
        <option value="8">8</option>
        <option value="16" selected>16</option>
        <option value="32">32</option>
      </select>
      <button id="startBtn">Start Training</button>
      <button id="resetBtn" class="danger">Reset Network</button>
      <div class="stats">
        <div class="stat"><div class="value" id="epochVal">0</div><div class="label">Epochs</div></div>
        <div class="stat"><div class="value" id="lossVal">&mdash;</div><div class="label">Loss (MSE)</div></div>
        <div class="stat"><div class="value" id="maeVal">&mdash;</div><div class="label">Mean Abs Error</div></div>
        <div class="stat"><div class="value" id="accVal">&mdash;</div><div class="label">Exact Hits (&plusmn;0.5)</div></div>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>Test It Yourself</h2>
      <div class="predict-row">
        <input type="number" id="inA" value="3.7" step="0.1" min="0" max="10">
        <span>+</span>
        <input type="number" id="inB" value="8.2" step="0.1" min="0" max="10">
      </div>
      <button id="predictBtn" class="secondary">Predict Sum</button>
      <div class="result" id="resultBox">Train the network first, then test it here.</div>
    </div>
  </div>

  <div class="card">
    <h2>Loss Over Time</h2>
    <canvas id="lossChart"></canvas>
  </div>
</div>

<script>
const RANGE = 10;

class Net {
  constructor(h) {
    this.h = h;
    this.w1 = this.mat(2, h);
    this.b1 = new Array(h).fill(0);
    this.w2 = this.mat(h, h);
    this.b2 = new Array(h).fill(0);
    this.w3 = this.mat(h, 1);
    this.b3 = [0];
  }
  mat(r, c) {
    const m = [];
    const scale = Math.sqrt(2 / r);
    for (let i = 0; i < r; i++) {
      const row = [];
      for (let j = 0; j < c; j++) row.push((Math.random() * 2 - 1) * scale);
      m.push(row);
    }
    return m;
  }
  forward(x) {
    const z1 = [], a1 = [];
    for (let j = 0; j < this.h; j++) {
      let s = this.b1[j] + x[0] * this.w1[0][j] + x[1] * this.w1[1][j];
      z1.push(s);
      a1.push(Math.tanh(s));
    }
    const z2 = [], a2 = [];
    for (let j = 0; j < this.h; j++) {
      let s = this.b2[j];
      for (let k = 0; k < this.h; k++) s += a1[k] * this.w2[k][j];
      z2.push(s);
      a2.push(Math.tanh(s));
    }
    let z3 = this.b3[0];
    for (let k = 0; k < this.h; k++) z3 += a2[k] * this.w3[k][0];
    return { z1, a1, z2, a2, z3, out: z3 };
  }
  trainBatch(batch, lr) {
    const gw1 = Array.from({ length: 2 }, () => new Array(this.h).fill(0));
    const gb1 = new Array(this.h).fill(0);
    const gw2 = Array.from({ length: this.h }, () => new Array(this.h).fill(0));
    const gb2 = new Array(this.h).fill(0);
    const gw3 = new Array(this.h).fill(0);
    let gb3 = 0;
    let loss = 0;
    for (const { x, y } of batch) {
      const f = this.forward(x);
      const err = f.out - y;
      loss += err * err;
      const d3 = 2 * err;
      for (let k = 0; k < this.h; k++) {
        gw3[k] += d3 * f.a2[k];
      }
      gb3 += d3;
      const d2 = new Array(this.h).fill(0);
      for (let k = 0; k < this.h; k++) {
        d2[k] = d3 * this.w3[k][0] * (1 - f.a2[k] * f.a2[k]);
      }
      const d1 = new Array(this.h).fill(0);
      for (let k = 0; k < this.h; k++) {
        for (let j = 0; j < this.h; j++) {
          gw2[k][j] += d2[j] * f.a1[k];
          d1[k] += d2[j] * this.w2[k][j];
        }
      }
      for (let k = 0; k < this.h; k++) d1[k] *= 1 - f.a1[k] * f.a1[k];
      for (let i = 0; i < 2; i++) {
        for (let j = 0; j < this.h; j++) gw1[i][j] += d1[j] * x[i];
      }
      for (let j = 0; j < this.h; j++) gb1[j] += d1[j];
      for (let j = 0; j < this.h; j++) gb2[j] += d2[j];
    }
    const n = batch.length;
    for (let i = 0; i < 2; i++)
      for (let j = 0; j < this.h; j++) this.w1[i][j] -= lr * gw1[i][j] / n;
    for (let j = 0; j < this.h; j++) this.b1[j] -= lr * gb1[j] / n;
    for (let k = 0; k < this.h; k++)
      for (let j = 0; j < this.h; j++) this.w2[k][j] -= lr * gw2[k][j] / n;
    for (let j = 0; j < this.h; j++) this.b2[j] -= lr * gb2[j] / n;
    for (let k = 0; k < this.h; k++) this.w3[k][0] -= lr * gw3[k] / n;
    this.b3[0] -= lr * gb3 / n;
    return loss / n;
  }
}

function makeDataset(n) {
  const data = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * RANGE;
    const b = Math.random() * RANGE;
    data.push({ x: [a / RANGE, b / RANGE], y: (a + b) / (2 * RANGE), raw: [a, b] });
  }
  return data;
}

const trainData = makeDataset(600);
const testData = makeDataset(200);

let net = null;
let running = false;
let epoch = 0;
let lossHistory = [];

const chart = document.getElementById("lossChart");
const ctx = chart.getContext("2d");

function initNet() {
  net = new Net(parseInt(document.getElementById("hidden").value, 10));
  epoch = 0;
  lossHistory = [];
  updateStats(null);
  drawChart();
  document.getElementById("resultBox").textContent = "Train the network first, then test it here.";
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function evaluate() {
  let se = 0, ae = 0, hits = 0;
  for (const d of testData) {
    const p = net.forward(d.x).out * 2 * RANGE;
    const t = d.y * 2 * RANGE;
    se += (p - t) ** 2;
    ae += Math.abs(p - t);
    if (Math.abs(p - t) <= 0.5) hits++;
  }
  return { mse: se / testData.length, mae: ae / testData.length, acc: hits / testData.length };
}

function updateStats(loss) {
  document.getElementById("epochVal").textContent = epoch;
  if (loss !== null) {
    const ev = evaluate();
    document.getElementById("lossVal").textContent = loss.toExponential(2);
    document.getElementById("maeVal").textContent = ev.mae.toFixed(3);
    document.getElementById("accVal").textContent = (ev.acc * 100).toFixed(1) + "%";
  }
}

function drawChart() {
  const w = chart.clientWidth, h = chart.clientHeight;
  chart.width = w * devicePixelRatio;
  chart.height = h * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#262b38";
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = (h - 30) * i / 4 + 15;
    ctx.beginPath();
    ctx.moveTo(40, y);
    ctx.lineTo(w - 10, y);
    ctx.stroke();
  }
  if (lossHistory.length < 2) {
    ctx.fillStyle = "#8b93a7";
    ctx.font = "13px system-ui";
    ctx.fillText("waiting for training data...", w / 2 - 80, h / 2);
    return;
  }
  const logs = lossHistory.map(l => Math.log10(Math.max(l, 1e-12)));
  const min = Math.min(...logs), max = Math.max(...logs);
  const span = Math.max(max - min, 0.5);
  ctx.strokeStyle = "#60a5fa";
  ctx.lineWidth = 2;
  ctx.beginPath();
  logs.forEach((v, i) => {
    const x = 40 + (w - 50) * i / (logs.length - 1);
    const y = 15 + (h - 30) * (1 - (v - min) / span);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = "#8b93a7";
  ctx.font = "11px system-ui";
  ctx.fillText(max.toFixed(1), 5, 19);
  ctx.fillText(min.toFixed(1), 5, h - 17);
  ctx.fillText("log10(loss)", w / 2 - 25, h - 3);
}

function setStatus(text, cls) {
  const b = document.getElementById("statusBadge");
  b.textContent = text;
  b.className = "badge" + (cls ? " " + cls : "");
}

function loop() {
  if (!running) return;
  const lr = parseFloat(document.getElementById("lr").value);
  const batchSize = 32;
  let lastLoss = null;
  for (let e = 0; e < 10; e++) {
    shuffle(trainData);
    let epochLoss = 0, batches = 0;
    for (let i = 0; i < trainData.length; i += batchSize) {
      epochLoss += net.trainBatch(trainData.slice(i, i + batchSize), lr);
      batches++;
    }
    lastLoss = epochLoss / batches;
    epoch++;
  }
  lossHistory.push(lastLoss);
  if (lossHistory.length > 400) lossHistory.shift();
  updateStats(lastLoss);
  drawChart();
  requestAnimationFrame(loop);
}

document.getElementById("startBtn").addEventListener("click", () => {
  if (!net) initNet();
  running = !running;
  document.getElementById("startBtn").textContent = running ? "Pause Training" : "Resume Training";
  setStatus(running ? "training" : "paused", running ? "" : "idle");
  if (running) requestAnimationFrame(loop);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  running = false;
  document.getElementById("startBtn").textContent = "Start Training";
  setStatus("idle", "idle");
  initNet();
});

document.getElementById("predictBtn").addEventListener("click", () => {
  if (!net || epoch === 0) {
    document.getElementById("resultBox").innerHTML = "The network is untrained &mdash; start training first.";
    return;
  }
  const a = parseFloat(document.getElementById("inA").value) || 0;
  const b = parseFloat(document.getElementById("inB").value) || 0;
  const pred = net.forward([a / RANGE, b / RANGE]).out * 2 * RANGE;
  const actual = a + b;
  document.getElementById("resultBox").innerHTML =
    `Predicted: <b>${pred.toFixed(3)}</b><br>Actual: ${actual.toFixed(3)}<br>Error: ${Math.abs(pred - actual).toFixed(3)}`;
});

window.addEventListener("resize", drawChart);
initNet();
</script>
</body>
</html>
